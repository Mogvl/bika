version: '3.8'

services:
  bika:
    build: .
    container_name: bika-web
    restart: unless-stopped

    # ==================== 端口映射 ====================
    # 格式: "宿主机端口:容器端口"
    # 宿主机端口可自定义，避免与其它服务冲突
    # 绿联云访问地址: http://<NAS-IP>:4000
    ports:
      - "4000:4000"

    # ==================== 环境变量 ====================
    # PORT: 服务端口（需与上方容器端口一致）
    # TZ: 时区设置
    environment:
      - PORT=4000
      - TZ=Asia/Shanghai

    # ==================== 数据持久化 ====================
    # 将容器内数据映射到宿主机，防止重启丢失
    # ./data 目录会自动创建在当前文件夹下
    volumes:
      # 漫画下载保存位置
      - ./data/downloads:/data/downloads
      # 配置文件持久化
      - ./data/config:/data/config
      # 缓存文件
      - ./data/cache:/data/cache

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
