version: '3.8'
services:
  bika-web:
    image: ghcr.io/mogvl/bika-web:latest
    container_name: bika-web
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - TZ=Asia/Shanghai
    volumes:
      - /volume1/漫画/bika/downloads:/data/downloads
      - /volume1/漫画/bika/config:/data/config
      - /volume1/漫画/bika/cache:/data/cache
    restart: unless-stopped
