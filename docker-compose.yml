version: '3.8'

services:
  bika:
    build: .
    container_name: bika-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TZ=Asia/Shanghai
    volumes:
      # 下载目录 - 漫画下载保存位置
      - ./data/downloads:/data/downloads
      # 配置持久化
      - ./data/config:/data/config
      # 缓存
      - ./data/cache:/data/cache
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
