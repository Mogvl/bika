<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
<div id="test">JS NOT LOADED</div>
<script>
document.getElementById('test').innerHTML = 'JS WORKS!';
console.log('Test script executed');
try {
  import('/assets/index-BffhHNta.js').then(() => {
    console.log('Vue module loaded OK');
    document.getElementById('test').innerHTML = 'VUE MODULE OK';
  }).catch(e => {
    console.error('Vue module error:', e);
    document.getElementById('test').innerHTML = 'VUE MODULE ERROR: ' + e.message;
  });
} catch(e) {
  console.error('Import error:', e);
  document.getElementById('test').innerHTML = 'IMPORT ERROR: ' + e.message;
}
</script>
</body>
</html>
